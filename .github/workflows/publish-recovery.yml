name: Publish recovered LAIN_OS history

on:
  push:
    branches:
      - recovery/publisher
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct recovered branches
        shell: bash
        run: |
          set -euo pipefail

          MAIN_BASE="fca83bef0467f320b42d11dffd0df1e979b0a09d"
          MAIN_TREE="90d42323964f051b0dcc2e69e2a21b3679c4fab3"
          FEATURE1_TREE="14ab2612382e5e97b366d031f42561bfba5268a0"
          FEATURE2_TREE="2f2ee185cb3434b13da322e577c2697e19ab38c1"

          python - <<'PY'
          from pathlib import Path
          bundle = Path("LAIN_OS-full-recovery.bundle").read_bytes()
          offset = bundle.find(b"PACK")
          if offset < 0:
              raise SystemExit("PACK payload not found in recovery bundle")
          Path("/tmp/lain-recovery.pack").write_bytes(bundle[offset:])
          PY

          git index-pack --stdin < /tmp/lain-recovery.pack

          git cat-file -e "${MAIN_TREE}^{tree}"
          git cat-file -e "${FEATURE1_TREE}^{tree}"
          git cat-file -e "${FEATURE2_TREE}^{tree}"

          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [ "$CURRENT_MAIN" != "$MAIN_BASE" ]; then
            echo "Refusing publication: main changed from expected $MAIN_BASE to $CURRENT_MAIN"
            exit 1
          fi

          git config user.name "LAIN Recovery"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          NEW_MAIN="$(printf '%s\n' 'Recover LAIN_OS main source snapshot' | git commit-tree "$MAIN_TREE" -p "$CURRENT_MAIN")"
          git push origin "$NEW_MAIN:refs/heads/main"

          FEATURE1="$(printf '%s\n' 'Add bounded Android capability expansion v1' | git commit-tree "$FEATURE1_TREE" -p "$NEW_MAIN")"
          FEATURE2="$(printf '%s\n' 'Fix reviewed Android privacy and clipboard verification edges' | git commit-tree "$FEATURE2_TREE" -p "$FEATURE1")"

          git push origin "$FEATURE2:refs/heads/feature/android-capabilities-v1"

          echo "main=$NEW_MAIN"
          echo "feature1=$FEATURE1"
          echo "feature2=$FEATURE2"
