[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lain-local"
version = "0.0.1"
description = "Loyal Autonomous Intelligence Network runtime"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lain = "lain.cli:main"
lain-groq-planner = "lain.planner_adapters.groq:main"

[tool.setuptools.packages.find]
include = ["lain*"]
